<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Luz suave en el centro, madera oscura en los bordes -->
    <radialGradient id="base" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#5a3d28"/>
      <stop offset="55%" stop-color="#3a2618"/>
      <stop offset="100%" stop-color="#1a100a"/>
    </radialGradient>

    <!-- Viñeta para oscurecer las esquinas -->
    <radialGradient id="vineta" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Palos de la baraja española, en tramas muy sutiles -->
    <pattern id="palos" width="180" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <g fill="none" stroke="#efe2c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.07">
        <!-- Oro -->
        <g transform="translate(45 45)">
          <circle r="16"/>
          <circle r="8"/>
          <circle r="2" fill="#efe2c0"/>
        </g>
        <!-- Copa -->
        <g transform="translate(135 45)">
          <path d="M-13 -14 H13 C13 2 7 8 0 8 C-7 8 -13 2 -13 -14 Z"/>
          <path d="M0 8 V17 M-8 17 H8"/>
        </g>
        <!-- Espada -->
        <g transform="translate(45 135)">
          <path d="M0 -20 L5 -8 V8 H-5 V-8 Z"/>
          <path d="M-13 8 H13 M0 8 V20"/>
        </g>
        <!-- Basto -->
        <g transform="translate(135 135)">
          <rect x="-5" y="-18" width="10" height="36" rx="5"/>
          <path d="M-5 -4 H-10 M5 6 H10"/>
        </g>
      </g>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#palos)"/>
  <rect width="1920" height="1080" fill="url(#vineta)"/>

  <!-- Doble marco fino, color arena -->
  <rect x="36" y="36" width="1848" height="1008" rx="6" fill="none" stroke="#b58f6b" stroke-opacity="0.40" stroke-width="2"/>
  <rect x="50" y="50" width="1820" height="980" rx="3" fill="none" stroke="#b58f6b" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Detalle en las cuatro esquinas -->
  <g fill="none" stroke="#b58f6b" stroke-opacity="0.45" stroke-width="2">
    <path d="M36 96 V36 H96"/>
    <path d="M1824 36 H1884 V96"/>
    <path d="M36 984 V1044 H96"/>
    <path d="M1824 1044 H1884 V984"/>
  </g>
</svg>

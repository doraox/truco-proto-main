<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTADOR TRUQUINI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Karla:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="cuerpoContador">
    <div class="container text-center">
        <div class="row pt-5">
            <!-- EQUIPO 1: NOSOTROS -->
            <div class="col-6">
                <section class="team">
                    <h1>NOSOTROS</h1>
                    <hr style="background-color: white;">
                    <p class="puntaje m-0">MALAS</p>
                    <div class="malas d-flex justify-content-center flex-wrap gap-1 my-2"></div>
                    <hr style="background-color: white;">
                    <p class="puntaje m-0">BUENAS</p>
                    <div class="buenas d-flex justify-content-center flex-wrap gap-1 my-2"></div>
                    
                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <button type="button" class="btn btn-primary btn-lg sumar">+</button>
                        <button type="button" class="btn btn-primary btn-lg restar">-</button>
                    </div>
                </section>
            </div>

            <!-- EQUIPO 2: ELLOS -->
            <div class="col-6">
                <section class="team">
                    <h1>ELLOS</h1>
                    <hr style="background-color: white;">
                    <p class="puntaje m-0">MALAS</p>
                    <div class="malas d-flex justify-content-center flex-wrap gap-1 my-2"></div>
                    <hr style="background-color: white;">
                    <p class="puntaje m-0">BUENAS</p>
                    <div class="buenas d-flex justify-content-center flex-wrap gap-1 my-2"></div>
                    
                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <button type="button" class="btn btn-primary btn-lg sumar">+</button>
                        <button type="button" class="btn btn-primary btn-lg restar">-</button>
                    </div>
                </section>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>

</html>
